[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-sec"
version = "0.1.0"
description = "Comprehensive Security Scanner & Evaluation Framework for RAG Applications"
readme = "README.md"
authors = [{ name = "RAG Security Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
frameworks = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0"
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
rag-sec = "rag_sec.cli.main:main"
